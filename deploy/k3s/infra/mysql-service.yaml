# Service interno de MySQL en `infra`.
# El backend (namespace hosting) lo alcanza como: mysql.infra.svc.cluster.local:3306
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: infra
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
