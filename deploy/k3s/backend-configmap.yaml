# ==============================================================================
# FaruTech — Configuración no secret del backend (Laravel/Lumen)
# Las credenciales de DB y APP_KEY se inyectan desde el Secret `backend-secrets`
# (ver scripts/copy-mysql-secret.sh). El Secret NO se versiona.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: hosting
data:
  APP_NAME: "FaruTech API"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://api.farutech-dev"
  APP_TIMEZONE: "UTC"
  LOG_CHANNEL: "stack"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql.infra.svc.cluster.local"   # MySQL vive en el namespace `infra`
  DB_PORT: "3306"
  CACHE_DRIVER: "file"
  QUEUE_CONNECTION: "sync"