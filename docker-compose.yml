# ==========================================================================
# FaruTech — docker-compose (desarrollo / Raspberry Pi)
#
#   cp .env.example .env
#   docker compose up -d --build
#
# El frontend queda disponible en http://localhost:8080 (SPA + API en /api)
# ==========================================================================

services:
  db:
    image: mariadb:10.11
    container_name: farutech_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farutech}
      MYSQL_USER: ${MYSQL_USER:-farutech_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-farutech_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
      # Schema + seeds automáticos (solo en el primer arranque del volumen)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - farutech-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: farutech_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-FaruTech API}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Define APP_KEY en tu archivo .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-farutech}
      DB_USERNAME: ${MYSQL_USER:-farutech_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-farutech_password}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - farutech-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: farutech_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # en desarrollo se mapea a 8080 para no chocar con el proxy
    depends_on:
      - backend
    networks:
      - farutech-net

volumes:
  db_data:
  backend_storage:

networks:
  farutech-net:
    driver: bridge