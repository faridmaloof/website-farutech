name: Deploy to Raspberry Pi

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sincronizar archivos
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude 'dist' \
            --exclude '.git' \
            --exclude '.env' \
            ./ pi@192.168.1.100:~/dev-server/projects/farutech/

      - name: Reconstruir contenedores
        run: ssh pi@192.168.1.100 "cd ~/dev-server/projects/farutech && docker compose up -d --build"