# ==========================================================================
# FaruTech — Nginx interno del backend
# Traduce HTTP -> FastCGI (php-fpm) para servir la API Laravel/Lumen.
# php-fpm escucha en 127.0.0.1:9000 dentro del mismo contenedor.
# ==========================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Front controller de la API
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP vía FastCGI
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Denegar archivos ocultos (excepto .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}