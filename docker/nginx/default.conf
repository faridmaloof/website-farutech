# ==========================================================================
# FaruTech — Frontend Nginx
# Sirve el build estático (SPA) y proxyea /api al contenedor backend.
#
# NOTA: proxy_pass NO reescribe el prefijo /api (el backend Lumen registra
# sus rutas bajo el prefijo 'api', p.ej. /api/blog/...). Si tu backend
# espera la API en la raíz, cambia `proxy_pass http://backend:80;` por
# `proxy_pass http://backend:80/;` (elimina el prefijo /api).
# ==========================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # API -> contenedor backend (HTTP en :80). ^~ evita que las regex de
    # estáticos intercepten las rutas de la API.
    location ^~ /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Estáticos con caché largo
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}